<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POD Business - Goal & Reward</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#2b1d13,#100b08 60%);color:#eee;font-family:Arial,sans-serif}
.container{width:min(1260px,94%);margin:28px auto}
header{text-align:center;margin-bottom:24px}
.small-title{color:#e0a24c;letter-spacing:6px;font-weight:bold;font-size:13px}
h1{font:700 46px Georgia,serif;color:#f4dfad;margin:7px 0}
.subtitle{color:#db9845;font-style:italic;font-size:17px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:16px;align-items:start}
.left,.right{min-width:0}
.panel,.total-box{background:linear-gradient(145deg,#271b12,#1a110c);border:1px solid #765332;border-radius:17px;padding:18px;margin-bottom:16px}
.total-box{text-align:center;padding:24px}
.total-number{font-size:56px;font-weight:bold;color:#f4c35e}
.total-label{font-size:12px;letter-spacing:3px;color:#bda98f}
.progress{height:17px;background:#49392b;border:1px solid #6c5036;border-radius:20px;overflow:hidden;margin:18px 3px 11px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#b96318,#f0c35c);transition:.5s}
.remaining{text-align:center;color:#d2c0aa;font-size:14px}
.panel-title{font-weight:bold;color:#f0c05a;font-size:18px;margin-bottom:13px}
.order-row{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:9px}
select,input,textarea{width:100%;background:#0f0c0a;color:#eee;border:1px solid #765332;border-radius:8px;padding:12px;outline:none}
select:focus,input:focus,textarea:focus{border-color:#d89339}
.add-btn{width:100%;margin-top:9px;background:#bd681d;color:white}
.add-btn:hover{background:#d67d28}
.buttons{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.buttons button{background:#45352a;color:#eee}
.buttons .danger{background:#733436}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #3c2c20}
th{color:#e8ba5c;background:#3a291d}
.empty{text-align:center;color:#8e7c6a;padding:24px}
.note{height:215px;resize:vertical;line-height:28px;background:repeating-linear-gradient(#0f0c0a,#0f0c0a 27px,#2b2119 28px)}
.hint{font-size:12px;color:#8e7c6a;margin-top:8px}
.goal-form{display:grid;gap:8px}
.icon-picker{position:relative}
.icon-button{width:100%;height:47px;background:#0f0c0a;border:1px solid #765332;color:#eee;border-radius:8px;text-align:left;font-size:15px;cursor:pointer}
.icon-button span{font-size:24px;vertical-align:middle;margin-right:9px}
.icon-panel{display:none;position:absolute;top:52px;left:0;width:100%;background:#120d09;border:1px solid #765332;border-radius:10px;padding:9px;z-index:50;box-shadow:0 15px 30px #000}
.icon-panel.show{display:block}
.icon-list{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-height:205px;overflow:auto;margin-top:7px}
.icon-item{background:transparent;border:0;color:#fff;font-size:22px;padding:6px;border-radius:5px;cursor:pointer}
.icon-item:hover{background:#493323}
.milestone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.milestone{position:relative;min-height:145px;text-align:center;padding:18px 13px;background:linear-gradient(145deg,#2a1c13,#18100c);border:1px solid #684a30;border-radius:15px;transition:.25s}
.milestone:hover{transform:translateY(-2px);border-color:#c58b3e}
.milestone.done{border-color:#e5b34e;box-shadow:0 0 20px rgba(238,181,70,.28)}
.micon{font-size:29px}.mnum{font-size:25px;font-weight:bold;color:#f1c35d;margin-top:4px}.reward{font-size:14px;margin-top:7px;line-height:1.4}.mremain{font-size:12px;color:#aaa;margin-top:9px}
.menu{position:absolute;top:6px;right:6px}.menu>button{background:transparent;border:0;color:#aa9782;font-size:21px;width:28px;height:28px;padding:0;cursor:pointer}.menu-box{display:none;position:absolute;right:0;top:29px;width:185px;background:#120d09;border:1px solid #765332;border-radius:8px;padding:4px;z-index:60;box-shadow:0 12px 28px #000}.menu-box.show{display:block}.menu-box button{width:100%;background:transparent;border:0;color:#eee;text-align:left;padding:9px;cursor:pointer;border-radius:5px}.menu-box button:hover{background:#3c2a1d}.menu-box .del{color:#ef8c8c}
td.history-actions{position:relative;width:70px;text-align:center}.history-menu-btn{background:transparent;border:0;color:#aa9782;font-size:21px;cursor:pointer}.history-menu-box{display:none;position:absolute;right:4px;top:36px;width:175px;background:#120d09;border:1px solid #765332;border-radius:8px;padding:4px;z-index:80;box-shadow:0 12px 28px #000}.history-menu-box.show{display:block}.history-menu-box button{width:100%;background:transparent;border:0;color:#eee;text-align:left;padding:9px;cursor:pointer;border-radius:5px}.history-menu-box button:hover{background:#3c2a1d}.history-menu-box .del{color:#ef8c8c}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:boom 1.35s ease-out forwards}
@keyframes boom{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
#congrats{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10000;width:min(470px,90%);background:#24160e;border:2px solid #e6b74f;border-radius:20px;text-align:center;padding:30px;box-shadow:0 0 80px #000,0 0 35px rgba(239,190,74,.4);animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.65);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.congrats-icon{font-size:58px}.congrats-title{font-size:29px;color:#f4c65f;font-weight:bold;margin:8px}.congrats-text{color:#e6d4bd;line-height:1.6}.close{margin-top:17px;background:#bd681d;color:white}
@media(max-width:900px){.layout{grid-template-columns:1fr}.order-row{grid-template-columns:1fr 1fr 1.5fr 1fr}.milestone-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){h1{font-size:35px}.order-row,.milestone-grid{grid-template-columns:1fr}.layout{display:block}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="fireworks"></div>
<div id="congrats">
  <div class="congrats-icon">🎉🏆🎆</div>
  <div class="congrats-title">MỤC TIÊU ĐÃ ĐẠT!</div>
  <div class="congrats-text" id="congratsText"></div>
  <button class="close" onclick="closeCongrats()">🔥 TIẾP TỤC CÀY</button>
</div>

<div class="container">
<header>
  <div class="small-title">POD BUSINESS</div>
  <h1>GOAL &amp; REWARD</h1>
  <div class="subtitle">Cày đơn hôm nay — Tự do ngày mai!</div>
  <div id="syncStatus" style="margin-top:10px;font-size:12px;color:#a99682">☁️ Đang chuẩn bị đồng bộ...</div>
</header>

<div class="layout">
<div class="left">
  <div class="total-box">
    <div class="total-number" id="total">0</div>
    <div class="total-label">TỔNG ĐƠN HÀNG</div>
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="remaining" id="remaining">Còn 100 đơn tới mục tiêu 100 đơn</div>
  </div>

  <div class="panel">
    <div class="panel-title">📦 NHẬP ĐƠN HÀNG</div>
    <div class="order-row">
      <select id="day"></select>
      <select id="month"></select>
      <select id="year"></select>
      <input id="count" type="number" min="1" placeholder="Số đơn">
    </div>
    <button class="add-btn" onclick="addOrder()">+ THÊM ĐƠN</button>
    <div class="buttons">
      <button onclick="backup()">💾 BACKUP DỮ LIỆU</button>
      <button onclick="restore()">📂 KHÔI PHỤC</button>
      <button class="danger" onclick="clearOrders()">🗑️ XÓA TẤT CẢ</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">🗓️ LỊCH SỬ ĐƠN HÀNG</div>
    <table><thead><tr><th>Ngày</th><th>Số đơn</th><th style="width:70px"> </th></tr></thead><tbody id="history"></tbody></table>
  </div>

  <div class="panel">
    <div class="panel-title">🏆 MỐC &amp; PHẦN THƯỞNG</div>
    <div class="milestone-grid" id="milestones"></div>
  </div>
</div>

<div class="right">
  <div class="panel">
    <div class="panel-title">📝 NOTE</div>
    <textarea class="note" id="note" placeholder="Muốn ghi gì ở đây..."></textarea>
    <div class="hint">✓ Tự động lưu khi bạn nhập</div>
  </div>

  <div class="panel">
    <div class="panel-title">🎯 THÊM MỤC TIÊU</div>
    <div class="goal-form">
      <div class="icon-picker">
        <button class="icon-button" onclick="toggleIcons()"><span id="selectedIcon">🎯</span>Chọn icon <b style="float:right">▼</b></button>
        <div class="icon-panel" id="iconPanel">
          <input id="iconSearch" placeholder="🔎 Tìm icon..." oninput="renderIcons()">
          <div class="icon-list" id="iconList"></div>
        </div>
      </div>
      <input id="goalOrders" type="number" min="1" placeholder="Mốc đơn, ví dụ 3000">
      <input id="goalName" placeholder="Tên mục tiêu / phần thưởng">
      <button class="add-btn" onclick="addGoal()">+ THÊM MỤC TIÊU</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
const KEY="pod_goal_reward_v4";
const SUPABASE_URL="https://lysxtijjggnsmmmdzuzu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qIj58se_VIxC29LuAtHMoA_QLId52D4";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let remoteLoaded=false;
let saveTimer=null;
let data=JSON.parse(localStorage.getItem(KEY)||'{"orders":{},"goals":[],"note":""}');
if(!data.orders)data.orders={}; if(!data.goals)data.goals=[];

function setSyncStatus(text,color="#a99682"){
 const el=document.getElementById("syncStatus");
 if(el){el.textContent=text;el.style.color=color;}
}

function hasMeaningfulLocalData(){
 return Object.keys(data.orders||{}).length>0 || (data.goals||[]).length>0 || !!String(data.note||"").trim();
}

async function loadRemote(){
 try{
   setSyncStatus("☁️ Đang tải dữ liệu từ database...");
   const {data:rows,error}=await supabaseClient
     .from("app_notes")
     .select("id,content")
     .eq("id",1)
     .maybeSingle();
   if(error)throw error;
   if(rows && rows.content){
     let remoteData=null;
     try{remoteData=typeof rows.content==="string"?JSON.parse(rows.content):rows.content;}catch(e){remoteData=null;}
     if(remoteData && typeof remoteData==="object"){
       data=remoteData;
       if(!data.orders)data.orders={};
       if(!Array.isArray(data.goals))data.goals=[];
       localStorage.setItem(KEY,JSON.stringify(data));
       setSyncStatus("☁️ Đã đồng bộ dữ liệu", "#8fd694");
     }
   }else if(hasMeaningfulLocalData()){
     await saveRemote(true);
     setSyncStatus("☁️ Đã đưa dữ liệu hiện có lên database", "#8fd694");
   }else{
     await saveRemote(true);
     setSyncStatus("☁️ Database đã sẵn sàng", "#8fd694");
   }
   remoteLoaded=true;
   render();
 }catch(err){
   console.error("Supabase load error:",err);
   setSyncStatus("⚠️ Không kết nối được database — vẫn lưu trên máy", "#e7a56c");
   remoteLoaded=false;
 }
}

async function saveRemote(immediate=false){
 if(!remoteLoaded && !immediate)return;
 try{
   const payload={id:1,content:JSON.stringify(data),updated_at:new Date().toISOString()};
   const {error}=await supabaseClient.from("app_notes").upsert(payload,{onConflict:"id"});
   if(error)throw error;
   setSyncStatus("☁️ Đã lưu database", "#8fd694");
 }catch(err){
   console.error("Supabase save error:",err);
   setSyncStatus("⚠️ Lưu database lỗi — dữ liệu vẫn còn trên máy", "#e7a56c");
 }
}

function scheduleRemoteSave(){
 if(!remoteLoaded)return;
 clearTimeout(saveTimer);
 setSyncStatus("☁️ Đang lưu...");
 saveTimer=setTimeout(()=>saveRemote(false),600);
}

const defaultMilestones=[
 [25,"🍕","Một bữa ăn / tự thưởng nhỏ"],
 [50,"✈️","1 chuyến đi / 1 ngày nghỉ"],
 [100,"🖥️","Nâng cấp góc làm việc"],
 [150,"📱","Một món công nghệ muốn mua"],
 [200,"💵","Rút $500–1,000 tiêu cho bản thân"],
 [300,"🏦","Bắt đầu quỹ lớn — $2,000+"],
 [500,"🚙","Quỹ xe lớn — $5,000+"],
 [1000,"🚙","Quỹ xe lớn — $10,000+"],
 [2000,"🏆","Mục tiêu lớn: nâng cấp xe / khoản tiền lớn"]
];

// Chuyển các mốc mặc định + mục tiêu cũ thành một danh sách duy nhất
if(!Array.isArray(data.milestones)){
 data.milestones=defaultMilestones.map((x,i)=>({id:"m"+i,orders:x[0],icon:x[1],name:x[2]}));
 if(Array.isArray(data.goals)){
   data.goals.forEach((g,i)=>data.milestones.push({id:g.id||("g"+Date.now()+i),orders:Number(g.orders),icon:g.icon||"🎯",name:g.name||"Mục tiêu"}));
 }
}
if(!Array.isArray(data.milestones))data.milestones=[];

const icons={
"mục tiêu":"🎯","tiền":"💰","dollar":"💵","nhẫn":"💍","kim cương":"💎","vàng":"🥇","bạc":"🥈",
"xe":"🚗","ô tô":"🚗","xe hơi":"🚘","motor":"🏍️","xe máy":"🏍️","nhà":"🏠","biệt thự":"🏡",
"du lịch":"✈️","máy bay":"✈️","điện thoại":"📱","iphone":"📱","ipad":"📱","laptop":"💻","máy tính":"💻",
"pc":"🖥️","màn hình":"🖥️","ghế":"💺","bàn":"🪑","đồng hồ":"⌚","quà":"🎁","ăn":"🍕","đồ ăn":"🍔",
"cafe":"☕","game":"🎮","ps5":"🎮","camera":"📷","youtube":"▶️","facebook":"📘","tiktok":"🎵",
"công việc":"💼","kinh doanh":"📈","shop":"🛍️","cửa hàng":"🏪","tự do":"🕊️","nghỉ":"🏖️",
"biển":"🌊","núi":"⛰️","gym":"🏋️","chạy":"🏃","sách":"📚","học":"🎓","tốt nghiệp":"🎓",
"ngôi sao":"⭐","lửa":"🔥","cúp":"🏆","huy chương":"🏅","vương miện":"👑","thời gian":"⏰",
"tiết kiệm":"🏦","chìa khóa":"🔑","cưới":"💍","em bé":"👶","gia đình":"👨‍👩‍👦","tình yêu":"❤️",
"chó":"🐶","mèo":"🐱","âm nhạc":"🎵","guitar":"🎸","phim":"🎬","party":"🎉","sinh nhật":"🎂",
"noel":"🎄","christmas":"🎄","halloween":"🎃","mục tiêu lớn":"🏆","túi xách":"👜","giày":"👟",
"quần áo":"👕","mỹ phẩm":"💄","nhẫn cưới":"💍","thuyền":"🚤","du thuyền":"🛥️","máy bay riêng":"🛩️"
};

function save(){localStorage.setItem(KEY,JSON.stringify(data));scheduleRemoteSave();}
function total(){return Object.values(data.orders).reduce((a,b)=>a+Number(b),0);}
function pad(n){return String(n).padStart(2,"0")}
function dateKey(){return `${document.getElementById("year").value}-${pad(document.getElementById("month").value)}-${pad(document.getElementById("day").value)}`}

function setupDates(){
 const now=new Date(), d=document.getElementById("day"),m=document.getElementById("month"),y=document.getElementById("year");
 for(let i=1;i<=31;i++)d.innerHTML+=`<option value="${i}">${i}</option>`;
 for(let i=1;i<=12;i++)m.innerHTML+=`<option value="${i}">${i}</option>`;
 for(let i=2020;i<=2040;i++)y.innerHTML+=`<option value="${i}">${i}</option>`;
 d.value=now.getDate();m.value=now.getMonth()+1;y.value=now.getFullYear();
}
function validDays(){
 const d=document.getElementById("day"), m=+document.getElementById("month").value, y=+document.getElementById("year").value, max=new Date(y,m,0).getDate();
 [...d.options].forEach(o=>o.hidden=+o.value>max);
 if(+d.value>max)d.value=max;
}
document.getElementById("month").addEventListener("change",validDays);
document.getElementById("year").addEventListener("change",validDays);

function addOrder(){
 const k=dateKey(), n=Number(document.getElementById("count").value);
 if(!n||n<1)return alert("Nhập số đơn hợp lệ!");
 const old=total(); data.orders[k]=(data.orders[k]||0)+n; save();
 document.getElementById("count").value=""; render();
 const reached=data.milestones.filter(g=>old<Number(g.orders)&&total()>=Number(g.orders)).sort((a,b)=>a.orders-b.orders);
 if(reached.length)celebrate(reached[0]);
}
function render(){
 const t=total();document.getElementById("total").textContent=t.toLocaleString();
 document.getElementById("bar").style.width=Math.min(t/100*100,100)+"%";
 document.getElementById("remaining").textContent=t>=100?"🎉 Đã đạt mục tiêu 100 đơn!":`Còn ${100-t} đơn tới mục tiêu 100 đơn`;
 renderHistory();renderGoals();
}
function renderHistory(){
 const h=document.getElementById("history"), ks=Object.keys(data.orders).sort().reverse();
 h.innerHTML=ks.length?ks.map(k=>`<tr><td>${k.split("-").reverse().join("/")}</td><td><b>${data.orders[k]}</b></td><td class="history-actions"><button class="history-menu-btn" onclick="toggleHistoryMenu('${k}',event)">⋮</button><div class="history-menu-box" id="history-menu-${k}"><button onclick="editOrder('${k}')">✏️ Chỉnh sửa ngày / số đơn</button><button class="del" onclick="deleteOrder('${k}')">🗑️ Xóa dữ liệu ngày</button></div></td></tr>`).join(""):`<tr><td colspan="3" class="empty">Chưa có dữ liệu đơn hàng.</td></tr>`;
}
function renderGoals(){
 const box=document.getElementById("milestones"),t=total();
 const arr=[...data.milestones].sort((a,b)=>Number(a.orders)-Number(b.orders));
 box.innerHTML=arr.map(g=>{
   const done=t>=g.orders, rem=Math.max(g.orders-t,0);
   return `<div class="milestone ${done?"done":""}">
   <div class="menu"><button onclick="toggleMenu('${g.id}',event)">⋮</button><div class="menu-box" id="menu-${g.id}">
   <button onclick="editMilestone('${g.id}')">✏️ Chỉnh sửa mục tiêu</button>
   <button class="del" onclick="deleteMilestone('${g.id}')">🗑️ Xóa mục tiêu</button></div></div>
   <div class="micon">${g.icon}</div><div class="mnum">${done?"✓ ":""}${Number(g.orders).toLocaleString()} ĐƠN</div>
   <div class="reward">${esc(g.name)}</div><div class="mremain">${done?"🎉 ĐÃ ĐẠT!":`Còn ${rem.toLocaleString()} đơn`}</div></div>`;
 }).join("");
}
function toggleMenu(id,e){
 if(e)e.stopPropagation();
 document.querySelectorAll(".menu-box,.history-menu-box").forEach(x=>x.classList.remove("show"));
 const el=document.getElementById("menu-"+id);if(el)el.classList.toggle("show");
}
function toggleHistoryMenu(id,e){
 if(e)e.stopPropagation();
 document.querySelectorAll(".menu-box,.history-menu-box").forEach(x=>x.classList.remove("show"));
 const el=document.getElementById("history-menu-"+id);if(el)el.classList.toggle("show");
}
function addGoal(){
 const orders=Number(document.getElementById("goalOrders").value),name=document.getElementById("goalName").value.trim(),icon=document.getElementById("selectedIcon").textContent;
 if(!orders||orders<1)return alert("Nhập mốc đơn hợp lệ!");
 if(!name)return alert("Nhập tên mục tiêu!");
 data.milestones.push({id:"g"+Date.now(),orders,name,icon});data.milestones.sort((a,b)=>a.orders-b.orders);save();
 document.getElementById("goalOrders").value="";document.getElementById("goalName").value="";document.getElementById("selectedIcon").textContent="🎯";render();
}
function editMilestone(id){
 const g=data.milestones.find(x=>x.id===id);if(!g)return;
 const o=prompt("Mốc đơn:",g.orders);if(o===null)return;
 const n=prompt("Tên mục tiêu / phần thưởng:",g.name);if(n===null)return;
 const ic=prompt("Icon (emoji), ví dụ 💍 hoặc 🎯:",g.icon);if(ic===null)return;
 if(!Number(o)||Number(o)<1||!n.trim()||!ic.trim())return alert("Thông tin không hợp lệ!");
 g.orders=Number(o);g.name=n.trim();g.icon=ic.trim();save();render();
}
function deleteMilestone(id){
 const g=data.milestones.find(x=>x.id===id);if(!g)return;
 if(confirm(`Xóa mục tiêu "${g.name}" (${Number(g.orders).toLocaleString()} đơn)?`)){data.milestones=data.milestones.filter(x=>x.id!==id);save();render();}
}
function editOrder(oldKey){
 const oldCount=Number(data.orders[oldKey]||0);
 let newDate=prompt("Ngày mới (YYYY-MM-DD):",oldKey);if(newDate===null)return;
 newDate=newDate.trim().replaceAll("/","-");
 const m=newDate.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(!m)return alert("Ngày không hợp lệ. Hãy nhập dạng YYYY-MM-DD, ví dụ 2026-10-09.");
 const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]),dt=new Date(y,mo-1,d);
 if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return alert("Ngày không tồn tại!");
 newDate=`${y}-${pad(mo)}-${pad(d)}`;
 const newCount=Number(prompt("Số đơn:",oldCount));
 if(!newCount||newCount<1)return alert("Số đơn không hợp lệ!");
 delete data.orders[oldKey];data.orders[newDate]=(data.orders[newDate]||0)+newCount;save();render();
}
function deleteOrder(key){
 if(confirm(`Xóa dữ liệu ngày ${key.split("-").reverse().join("/")} (${data.orders[key]} đơn)?`)){delete data.orders[key];save();render();}
}

function toggleIcons(){document.getElementById("iconPanel").classList.toggle("show");renderIcons();}
function renderIcons(){
 const q=document.getElementById("iconSearch").value.toLowerCase().trim(),list=document.getElementById("iconList");
 list.innerHTML=Object.entries(icons).filter(([n])=>!q||n.includes(q)).map(([n,i])=>`<button class="icon-item" title="${n}" onclick="pickIcon('${i}')">${i}</button>`).join("");
}
function pickIcon(i){document.getElementById("selectedIcon").textContent=i;document.getElementById("iconPanel").classList.remove("show");}
document.addEventListener("click",e=>{if(!e.target.closest(".icon-picker"))document.getElementById("iconPanel").classList.remove("show");if(!e.target.closest(".menu")&&!e.target.closest(".history-actions"))document.querySelectorAll(".menu-box,.history-menu-box").forEach(x=>x.classList.remove("show"));});

document.getElementById("note").value=data.note||"";
document.getElementById("note").addEventListener("input",e=>{data.note=e.target.value;save()});

function celebrate(g){
 document.getElementById("congratsText").innerHTML=`<div style="font-size:28px">${g.icon}</div><b>${Number(g.orders).toLocaleString()} ĐƠN</b><br><br>${esc(g.name)}<br><br>🔥 Mày đã chạm tới mục tiêu này!`;
 document.getElementById("congrats").style.display="block";fireworks();
}
function fireworks(){
 const c=document.getElementById("fireworks"),colors=["#ffcf40","#ff5b5b","#54d8ff","#ff7ee5","#7dff7d","#fff"];
 c.innerHTML="";
 for(let b=0;b<6;b++)setTimeout(()=>{
   const cx=10+Math.random()*80,cy=10+Math.random()*55;
   for(let i=0;i<55;i++){const p=document.createElement("div"),a=Math.random()*Math.PI*2,dist=60+Math.random()*240;p.className="particle";p.style.left=cx+"%";p.style.top=cy+"%";p.style.setProperty("--x",Math.cos(a)*dist+"px");p.style.setProperty("--y",Math.sin(a)*dist+"px");p.style.background=colors[Math.floor(Math.random()*colors.length)];c.appendChild(p);setTimeout(()=>p.remove(),1500)}
 },b*280);
}
function closeCongrats(){document.getElementById("congrats").style.display="none";document.getElementById("fireworks").innerHTML=""}
function clearOrders(){if(confirm("Xóa toàn bộ lịch sử đơn hàng?")){data.orders={};save();render()}}
function backup(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="POD-Goal-Backup.json";a.click();
}
function restore(){
 const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=e=>{const r=new FileReader();r.onload=x=>{try{data=JSON.parse(x.target.result);save();document.getElementById("note").value=data.note||"";render();alert("Khôi phục thành công!")}catch{alert("File backup không hợp lệ!")}};r.readAsText(e.target.files[0])};i.click();
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
setupDates();validDays();render();renderIcons();loadRemote();
</script>
